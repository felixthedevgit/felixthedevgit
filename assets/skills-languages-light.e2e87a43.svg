<text x="182" y="422" font-size="11.5" fill="#512BD4">getting started</text>
<text x="90" y="445" font-size="12.5" fill="#8577AE">Picked it up two weeks ago for a desktop tool at the office. Still reading more than writing, but I like how much the compiler catches</text>
