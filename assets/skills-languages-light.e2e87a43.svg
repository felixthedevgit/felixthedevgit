<text x="90" y="53" font-size="12.5" fill="#8577AE">The language I write most days. Everything from the form service at the office to the small script that draws this page runs on it, and I</text>
<text x="90" y="70" font-size="12.5" fill="#8577AE">still enjoy how little ceremony it needs.</text>
