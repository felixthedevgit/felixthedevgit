<text x="193" y="324" font-size="11.5" fill="#663399">most weeks</text>
<text x="90" y="347" font-size="12.5" fill="#8577AE">Custom properties, grid and a few animations, no framework and no build step. Dark mode is not an afterthought, it is a second set of</text>
<text x="90" y="364" font-size="12.5" fill="#8577AE">variables.</text>
