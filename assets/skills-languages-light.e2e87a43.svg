<text x="90" y="151" font-size="12.5" fill="#8577AE">For the projects that outgrow a handful of files. The types catch the mistakes I would otherwise meet at runtime, and the editor</text>
<text x="90" y="168" font-size="12.5" fill="#8577AE">suddenly knows what every object looks like.</text>
