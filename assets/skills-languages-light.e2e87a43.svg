<text x="90" y="249" font-size="12.5" fill="#8577AE">Every interface I ship is hand-written markup. Semantic elements, forms that work without a script, and pages a screen reader can</text>
<text x="90" y="266" font-size="12.5" fill="#8577AE">follow from top to bottom.</text>
