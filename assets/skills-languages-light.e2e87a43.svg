<text x="200" y="520" font-size="11.5" fill="#00A2FF">regularly</text>
<text x="90" y="543" font-size="12.5" fill="#8577AE">The scripting language behind my Roblox games. Game logic, data stores, and the client-server split that every multiplayer feature has</text>
<text x="90" y="560" font-size="12.5" fill="#8577AE">to respect.</text>
