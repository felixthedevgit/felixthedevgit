<text x="100" y="30" font-size="15" font-weight="700" fill="#3B2E63">Node.js</text>
<circle cx="167" cy="25" r="2" fill="#517256"/>
<text x="175" y="30" font-size="11.5" fill="#517256">daily</text>
<text x="100" y="53" font-size="12.5" fill="#8577AE">My server runtime of choice. One process, no external services, and a standard library that covers more with every release, from fetch</text>
<text x="100" y="70" font-size="12.5" fill="#8577AE">to the built-in SQLite driver.</text>
