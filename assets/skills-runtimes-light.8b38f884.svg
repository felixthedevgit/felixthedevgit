<circle cx="171" cy="123" r="2" fill="#6B7280"/>
<text x="179" y="128" font-size="11.5" fill="#6B7280">most weeks</text>
<text x="100" y="151" font-size="12.5" fill="#8577AE">Routing and middleware for the services I build. The handlers stay thin, the actual logic lives in plain modules that know nothing</text>
<text x="100" y="168" font-size="12.5" fill="#8577AE">about HTTP.</text>
