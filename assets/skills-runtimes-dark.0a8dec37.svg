<text x="90" y="30" font-size="15" font-weight="700" fill="#EDE9FE">Node.js</text>
<rect x="159" y="22" width="8" height="5" rx="2.5" fill="#7fb371"/><rect x="170" y="22" width="8" height="5" rx="2.5" fill="#7fb371"/><rect x="181" y="22" width="8" height="5" rx="2.5" fill="#7fb371"/><rect x="192" y="22" width="8" height="5" rx="2.5" fill="#7fb371"/><rect x="203" y="22" width="8" height="5" rx="2.5" fill="#7fb371"/>
<text x="218" y="30" font-size="11.5" fill="#7fb371">daily</text>
<text x="90" y="53" font-size="12.5" fill="#A89CD3">My server runtime of choice. One process, no external services, and a standard library that covers more with every release, from fetch</text>
<text x="90" y="70" font-size="12.5" fill="#A89CD3">to the built-in SQLite driver.</text>
